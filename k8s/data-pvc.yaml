apiVersion: v1
kind: PersistentVolume #actual storage infra (path inside the minikube node)
metadata:
  name: fraud-data-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    # /data is one of the directories minikube persists across `minikube stop/start`
    # (it is wiped by `minikube delete`). Host project files are NOT visible here --
    # load the raw CSVs into the node first, e.g.:
    #   minikube cp ./data/unzipped/train_transaction.csv /data/unzipped/train_transaction.csv
    # or start the cluster with a bind mount:
    #   minikube start --mount --mount-string="$PWD/data:/data"
    path: /data
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim #request for storage that pods use
metadata:
  name: fraud-data-pvc
  namespace: airflow
spec:
  accessModes:
    - ReadWriteMany  # Multiple pods can read
  resources:
    requests:
      storage: 5Gi  # Adjust based on your data size
  storageClassName: standard  # Minikube's default storage class
  volumeName: fraud-data-pv
