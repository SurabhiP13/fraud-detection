name: CI - Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pandas numpy pyyaml scikit-learn lightgbm

    - name: Run smoke tests (config, DAG syntax, end-to-end pipeline on synthetic data)
      run: pytest -q tests/

  build-and-push:
    needs: test
    # Images are only pushed from branch builds; PRs just get the test job.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fraud-detection-airflow
            context: .
            file: ./Dockerfile
          - name: fraud-detection-model-training
            context: .
            file: ./Dockerfile.model-training
          - name: mlflow-server
            context: .
            file: ./Dockerfile.mlflow
          - name: fraud-detection-streamlit
            context: ./streamlit_app
            file: ./streamlit_app/Dockerfile

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Lowercase image prefix
      run: echo "IMAGE_PREFIX_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

    # QEMU + Buildx let a Linux runner emit arm64 layers too, so the same tag
    # runs on an Apple Silicon minikube node and on x86 clusters.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push ${{ matrix.name }} (amd64 + arm64)
      uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.file }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LOWER }}/${{ matrix.name }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LOWER }}/${{ matrix.name }}:${{ github.sha }}
        cache-from: type=gha,scope=${{ matrix.name }}
        cache-to: type=gha,scope=${{ matrix.name }},mode=max

    - name: Summary
      run: echo "Pushed ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LOWER }}/${{ matrix.name }}:${{ github.sha }}"
