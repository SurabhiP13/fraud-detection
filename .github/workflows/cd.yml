name: CD - Deploy to Kubernetes

# Deploys the images CI pushed to GHCR onto a Kubernetes cluster reachable from
# a SELF-HOSTED runner. The intended local setup is a runner on the same Mac
# that runs minikube (see docs/SETUP_MAC.md, "CI/CD"). Because the GHCR
# packages are private by default, the images are pulled into minikube's own
# Docker daemon here (with the workflow token) instead of relying on
# in-cluster pulls that would need a long-lived imagePullSecret.

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types: [completed]
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: airflow
  CHART_VERSION: "1.15.0"   # last chart shipping Airflow 2.9.3 -- keep in sync with scripts/deploy.sh

jobs:
  deploy:
    # Only deploy when triggered manually or when the upstream CI run succeeded.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - name: Resolve image prefix and tag
      run: |
        echo "IMAGE_PREFIX_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
        echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"

    - name: Configure kubeconfig
      env:
        KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
      run: |
        # A base64 kubeconfig secret targets a remote cluster. When it is not
        # set we assume the runner sits next to minikube and already has
        # ~/.kube/config (the default for a self-hosted macOS runner).
        if [ -n "$KUBECONFIG_B64" ]; then
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
        fi
        kubectl cluster-info
        kubectl get nodes -o wide

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pre-pull images into the cluster node
      run: |
        # On minikube (docker driver) point the CLI at the node's daemon so the
        # pulled images are already present and pullPolicy IfNotPresent works.
        if command -v minikube >/dev/null && minikube status >/dev/null 2>&1; then
          eval "$(minikube docker-env)"
        fi
        for img in fraud-detection-airflow fraud-detection-model-training mlflow-server fraud-detection-streamlit; do
          docker pull "$REGISTRY/$IMAGE_PREFIX_LOWER/$img:$IMAGE_TAG"
        done

    - name: Point manifests at the new image tags
      run: |
        # `sed -i.bak` is the only in-place form that works on both GNU (Linux)
        # and BSD (macOS) sed; a bare `sed -i` fails on a Mac runner.
        sed -i.bak "s|image: mlflow-server:v1|image: $REGISTRY/$IMAGE_PREFIX_LOWER/mlflow-server:$IMAGE_TAG|" k8s/mlflow-deployment.yaml
        sed -i.bak "s|image: fraud-detection-streamlit:v1|image: $REGISTRY/$IMAGE_PREFIX_LOWER/fraud-detection-streamlit:$IMAGE_TAG|" k8s/streamlit-deployment.yaml
        rm -f k8s/*.bak
        grep -n 'image:' k8s/mlflow-deployment.yaml k8s/streamlit-deployment.yaml

        # Airflow images + the image names the DAG hands to KubernetesPodOperator
        cat > /tmp/airflow-cd-values.yaml <<EOF
        images:
          airflow:
            repository: $REGISTRY/$IMAGE_PREFIX_LOWER/fraud-detection-airflow
            tag: "$IMAGE_TAG"
            pullPolicy: IfNotPresent
          pod_template:
            repository: $REGISTRY/$IMAGE_PREFIX_LOWER/fraud-detection-airflow
            tag: "$IMAGE_TAG"
            pullPolicy: IfNotPresent
        env:
          - name: FRAUD_AIRFLOW_IMAGE
            value: "$REGISTRY/$IMAGE_PREFIX_LOWER/fraud-detection-airflow:$IMAGE_TAG"
          - name: FRAUD_TRAINING_IMAGE
            value: "$REGISTRY/$IMAGE_PREFIX_LOWER/fraud-detection-model-training:$IMAGE_TAG"
        EOF
        cat /tmp/airflow-cd-values.yaml

    - name: Namespace and storage
      run: |
        kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f k8s/data-pvc.yaml

    - name: Deploy MLflow
      run: |
        kubectl apply -f k8s/mlflow-deployment.yaml
        kubectl rollout status deployment/mlflow -n "$NAMESPACE" --timeout=5m

    - name: Deploy Airflow with Helm
      run: |
        helm repo add apache-airflow https://airflow.apache.org >/dev/null 2>&1 || true
        helm repo update >/dev/null
        helm upgrade --install airflow apache-airflow/airflow \
          --version "$CHART_VERSION" \
          --namespace "$NAMESPACE" \
          -f k8s/airflow-values.yaml \
          -f /tmp/airflow-cd-values.yaml \
          --timeout 15m
        kubectl rollout status deployment/airflow-scheduler -n "$NAMESPACE" --timeout=10m
        kubectl rollout status deployment/airflow-webserver -n "$NAMESPACE" --timeout=10m

    - name: Deploy Streamlit
      run: |
        kubectl apply -f k8s/streamlit-deployment.yaml
        kubectl rollout status deployment/streamlit -n "$NAMESPACE" --timeout=10m

    - name: Deployment status
      if: always()
      run: |
        echo "=== Pods ==="; kubectl get pods -n "$NAMESPACE" -o wide || true
        echo "=== Services ==="; kubectl get svc -n "$NAMESPACE" || true
        echo "=== Recent events ==="; kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' | tail -20 || true

    - name: Trigger retraining DAG
      run: |
        kubectl exec -n "$NAMESPACE" deploy/airflow-scheduler -- \
          airflow dags trigger fraud_detection_pipeline_k8s || echo "DAG trigger failed (is the data loaded? scripts/fetch_data.sh)"
