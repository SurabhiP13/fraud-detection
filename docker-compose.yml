# Local stack: Postgres + Airflow (LocalExecutor) + MLflow + Streamlit.
#
# macOS note: the Airflow containers talk to the host Docker daemon over a
# unix socket so the DockerOperator DAG can launch sibling containers. Docker
# Desktop exposes it at /var/run/docker.sock; Colima does NOT create that
# symlink, so export the real path before `docker compose up`:
#
#   export DOCKER_SOCK="$HOME/.colima/default/docker.sock"
#
# (or put DOCKER_SOCK=/Users/<you>/.colima/default/docker.sock in a .env file
# next to this compose file -- .env is gitignored).

services:
  postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - fraud-detection

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraud-detection-airflow:compose
    container_name: airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQLALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'True'
      AIRFLOW_HOME: /opt/airflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW__LOGGING__RETRIEVE_LOGS_FROM_REMOTE_LOGGING: 'False'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'fraud-detection-secret-key-2026'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./scripts:/opt/airflow/scripts
      - ./config.yaml:/opt/airflow/config.yaml
      - fraud-detection-data:/opt/airflow/data
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    ports:
      - "8080:8080"
    networks:
      - fraud-detection
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username airflow --firstname Airflow --lastname User --role Admin --email airflow@example.com --password airflow 2>/dev/null || true &&
        airflow webserver
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  airflow-scheduler:
    image: fraud-detection-airflow:compose
    container_name: airflow-scheduler
    depends_on:
      airflow-webserver:
        condition: service_healthy
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQLALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW_HOME: /opt/airflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW__LOGGING__RETRIEVE_LOGS_FROM_REMOTE_LOGGING: 'False'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'fraud-detection-secret-key-2026'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./scripts:/opt/airflow/scripts
      - ./config.yaml:/opt/airflow/config.yaml
      - fraud-detection-data:/opt/airflow/data
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - fraud-detection
    command: airflow scheduler

  # Pipeline runner image used by the DockerOperator DAG. It is not a long-
  # running service; this entry only exists so `docker compose build` produces
  # the image the DAG references (fraud-detection-pipeline:latest).
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: fraud-detection-pipeline:latest
    profiles: ["build-only"]
    command: ["python", "--version"]

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: mlflow-server:compose
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - mlflow-volume:/mlflow
    networks:
      - fraud-detection
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  streamlit-app:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    image: fraud-detection-streamlit:compose
    container_name: fraud-detection-streamlit
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8501:8501"
    volumes:
      # MLflow stores artifacts on the *client* side under /mlflow/artifacts
      # (non-proxied artifact root), so every consumer mounts the same volume.
      - mlflow-volume:/mlflow
    networks:
      - fraud-detection
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres-db-volume:
  # Explicit names so the DockerOperator DAG can reference them regardless of
  # the compose project name (dags/fraud_detection_dag_docker.py).
  mlflow-volume:
    name: fraud-detection_mlflow
  fraud-detection-data:
    name: fraud-detection_data

networks:
  fraud-detection:
    name: fraud-detection_fraud-detection
    driver: bridge
